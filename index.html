    <script>
      (function () {
        try {
          var saved = localStorage.getItem('checklitz_theme');
          if (saved !== 'light') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
